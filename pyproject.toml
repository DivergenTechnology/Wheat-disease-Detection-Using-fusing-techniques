[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wded"
version = "0.2.0"
description = "Early detection of wheat diseases from UAV multispectral imagery fused with lagged weather and soil covariates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WDED Project" }]
keywords = ["wheat", "rust", "remote-sensing", "multispectral", "machine-learning", "ethiopia"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
geo = ["tifffile>=2023.0", "rasterio>=1.3"]
torch = ["torch>=2.1"]
dev = ["pytest>=7.4"]

[project.scripts]
wded = "wded.cli:main"

[tool.setuptools.packages.find]
include = ["wded*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
